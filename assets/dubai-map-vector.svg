<svg class="dubai-interactive-map" viewBox="0 0 920 580" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Dubai Service Coverage Map">
  <defs>
    <!-- Glow and shadow filters -->
    <filter id="dubai-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="hub-pin-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#c51210" flood-opacity="0.45" />
    </filter>
    <filter id="sub-pin-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#192023" flood-opacity="0.25" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="szr-highway-grad" x1="160" y1="460" x2="680" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c51210" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#ff5a52" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#c51210" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="coast-gradient" x1="100" y1="520" x2="720" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3" />
    </linearGradient>
    <radialGradient id="hub-radar-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c51210" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#c51210" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#c51210" stop-opacity="0" />
    </radialGradient>

    <!-- Dot Pattern for Futuristic Tech Texture -->
    <pattern id="tech-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" class="map-grid-dot" />
    </pattern>
  </defs>

  <style>
    .map-grid-dot { fill: rgba(100, 116, 139, 0.16); }
    body.dark-theme .map-grid-dot { fill: rgba(255, 255, 255, 0.1); }
    
    .dubai-landmass-fill { fill: rgba(241, 245, 249, 0.65); stroke: rgba(203, 213, 225, 0.7); stroke-width: 1.5; }
    body.dark-theme .dubai-landmass-fill { fill: rgba(23, 28, 31, 0.55); stroke: rgba(255, 255, 255, 0.12); }

    .gulf-water-label { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; fill: rgba(14, 165, 233, 0.55); }
    body.dark-theme .gulf-water-label { fill: rgba(56, 189, 248, 0.5); }

    .dubai-coast-line { stroke: rgba(14, 165, 233, 0.65); stroke-width: 2.2; fill: none; stroke-linecap: round; }
    body.dark-theme .dubai-coast-line { stroke: rgba(56, 189, 248, 0.55); }

    .highway-secondary { stroke: rgba(148, 163, 184, 0.4); stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
    body.dark-theme .highway-secondary { stroke: rgba(255, 255, 255, 0.18); }

    .highway-szr { stroke: url(#szr-highway-grad); stroke-width: 3; fill: none; stroke-linecap: round; filter: drop-shadow(0 0 4px rgba(197, 18, 16, 0.4)); }

    .district-label { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; fill: #192023; }
    body.dark-theme .district-label { fill: #f1f5f9; }

    .district-sublabel { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 8.5px; font-weight: 600; fill: #64748b; }
    body.dark-theme .district-sublabel { fill: #94a3b8; }

    .hub-pulse { animation: hubRadarPulse 2.6s infinite ease-out; transform-origin: 495px 235px; }
    .hub-pulse-d2 { animation: hubRadarPulse 2.6s infinite ease-out 1.3s; transform-origin: 495px 235px; }
    @keyframes hubRadarPulse {
      0% { r: 12px; opacity: 0.85; stroke-width: 2.5px; }
      100% { r: 64px; opacity: 0; stroke-width: 0.5px; }
    }

    .telemetry-route { stroke: #c51210; stroke-width: 1.8; stroke-dasharray: 4 6; stroke-linecap: round; fill: none; opacity: 0.75; animation: dashMove 3s linear infinite; }
    @keyframes dashMove {
      from { stroke-dashoffset: 40; }
      to { stroke-dashoffset: 0; }
    }
  </style>

  <!-- Ambient Dot Grid Background (Transparent) -->
  <rect x="0" y="0" width="920" height="580" fill="url(#tech-dots)" />

  <!-- Arabian Gulf Subtle Wave Accent Lines -->
  <g opacity="0.45">
    <path d="M 60 180 Q 150 160 260 210" stroke="rgba(14, 165, 233, 0.25)" stroke-width="1.2" fill="none" stroke-dasharray="3 6" />
    <path d="M 90 280 Q 180 260 280 320" stroke="rgba(14, 165, 233, 0.25)" stroke-width="1.2" fill="none" stroke-dasharray="3 6" />
    <path d="M 120 380 Q 200 360 260 410" stroke="rgba(14, 165, 233, 0.25)" stroke-width="1.2" fill="none" stroke-dasharray="3 6" />
    <text x="140" y="140" class="gulf-water-label">Arabian Gulf (Dubai Coast)</text>
  </g>

  <!-- Dubai Landmass Contour -->
  <path class="dubai-landmass-fill" d="
    M 90 530 
    C 130 500, 160 480, 190 440
    L 205 410
    C 215 390, 225 365, 240 350
    C 260 330, 280 315, 305 300
    C 335 280, 370 250, 410 230
    C 450 210, 490 190, 530 170
    C 555 155, 575 140, 600 125
    C 630 110, 670 95, 730 80
    L 860 170
    C 850 270, 810 370, 750 450
    C 690 510, 580 545, 460 550
    C 320 555, 190 545, 90 530 Z
  " />

  <!-- The Palm Jumeirah (Iconic Silhouette with Crescent, Trunk & Fronds) -->
  <g id="palm-jumeirah-island" transform="translate(230, 315)">
    <!-- Crescent Breakwater -->
    <path d="M -32 -20 C -20 -44 20 -44 32 -20 C 35 -14 30 -6 24 -10 C 14 -28 -14 -28 -24 -10 C -30 -6 -35 -14 -32 -20 Z" 
          fill="rgba(197, 18, 16, 0.18)" stroke="#c51210" stroke-width="1.4" />
    <!-- Trunk -->
    <line x1="0" y1="28" x2="0" y2="-12" stroke="#c51210" stroke-width="2.6" stroke-linecap="round" />
    <!-- Fronds -->
    <path d="M -18 -8 Q -10 -18 0 -12 Q 10 -18 18 -8" stroke="#c51210" stroke-width="1.4" fill="none" />
    <path d="M -22 -2 Q -12 -10 0 -6 Q 12 -10 22 -2" stroke="#c51210" stroke-width="1.4" fill="none" />
    <path d="M -20 4 Q -10 -4 0 0 Q 10 -4 20 4" stroke="#c51210" stroke-width="1.4" fill="none" />
    <!-- Palm Glow Dot -->
    <circle cx="0" cy="-18" r="3.5" fill="#c51210" />
    <circle cx="0" cy="-18" r="7" stroke="#c51210" stroke-width="1" opacity="0.5" fill="none" />
  </g>

  <!-- Dubai Coastline Edge Curve -->
  <path class="dubai-coast-line" d="
    M 90 530 
    C 130 500, 160 480, 190 440
    L 205 410
    C 215 390, 225 365, 230 345
    L 245 330
    C 270 310, 300 290, 335 270
    C 370 250, 410 230, 450 210
    C 490 190, 530 170, 560 150
    C 580 135, 605 125, 635 110
    L 730 80
  " />

  <!-- Dubai Creek (Khor Dubai) Winding Inlet -->
  <path d="M 590 130 C 595 150 585 170 575 190 C 565 210 570 230 590 245 C 610 255 640 255 660 250" 
        stroke="rgba(14, 165, 233, 0.6)" stroke-width="4.5" stroke-linecap="round" fill="none" />
  <text x="615" y="210" class="gulf-water-label" style="font-size: 8.5px;">Dubai Creek</text>

  <!-- Highway Networks -->
  <!-- 1. Sheikh Zayed Road (E11) - Main Lifeline Corridor -->
  <path class="highway-szr" d="
    M 140 500 
    C 185 450, 225 400, 270 350
    C 315 300, 370 260, 430 220
    C 485 185, 545 155, 610 120
    L 710 70
  " />

  <!-- 2. Al Khail Road (E44) - Parallel Arterial Highway -->
  <path class="highway-secondary" d="
    M 190 520 
    C 230 465, 280 415, 330 365
    C 380 315, 440 275, 510 230
    C 570 195, 630 165, 690 135
  " />

  <!-- 3. Sheikh Mohammed Bin Zayed Road (E311) - Outer Ring -->
  <path class="highway-secondary" d="
    M 250 535 
    C 300 480, 355 430, 415 380
    C 475 330, 545 285, 620 240
    C 685 200, 745 170, 800 145
  " />

  <!-- Connecting Radial Expressways -->
  <line x1="270" y1="350" x2="330" y2="365" class="highway-secondary" />
  <line x1="430" y1="220" x2="510" y2="230" class="highway-secondary" />
  <line x1="330" y1="365" x2="415" y2="380" class="highway-secondary" />
  <line x1="510" y1="230" x2="620" y2="240" class="highway-secondary" />

  <!-- Animated Telemetry Trajectory Lines (from Central Dispatch Hub) -->
  <!-- Hub is at Downtown Dubai: (495, 205) -->
  <path class="telemetry-route" d="M 495 205 Q 350 250 225 390" /> <!-- To Dubai Marina -->
  <path class="telemetry-route" d="M 495 205 Q 360 220 230 300" /> <!-- To Palm Jumeirah -->
  <path class="telemetry-route" d="M 495 205 Q 400 320 380 430" /> <!-- To Arabian Ranches -->
  <path class="telemetry-route" d="M 495 205 Q 470 290 420 340" /> <!-- To Dubai Hills -->
  <path class="telemetry-route" d="M 495 205 Q 570 150 635 120" /> <!-- To Deira -->
  <path class="telemetry-route" d="M 495 205 Q 600 230 680 230" /> <!-- To Mirdif -->

  <!-- ================= KEY DUBAI DISTRICT BEACONS & HUBS ================= -->

  <!-- 1. DUBAI MARINA & JBR -->
  <g class="district-node" transform="translate(225, 390)">
    <circle cx="0" cy="0" r="5" fill="#ffffff" stroke="#c51210" stroke-width="2" filter="url(#sub-pin-shadow)" />
    <circle cx="0" cy="0" r="2.2" fill="#c51210" />
    <text x="-12" y="18" class="district-label" text-anchor="middle">Dubai Marina</text>
    <text x="-12" y="28" class="district-sublabel" text-anchor="middle">&amp; JBR</text>
  </g>

  <!-- 2. THE PALM JUMEIRAH -->
  <g class="district-node" transform="translate(230, 280)">
    <circle cx="0" cy="0" r="5" fill="#ffffff" stroke="#c51210" stroke-width="2" filter="url(#sub-pin-shadow)" />
    <circle cx="0" cy="0" r="2.2" fill="#c51210" />
    <text x="-38" y="4" class="district-label" text-anchor="end">Palm Jumeirah</text>
    <text x="-38" y="14" class="district-sublabel" text-anchor="end">Luxury Villas</text>
  </g>

  <!-- 3. JUMEIRAH & AL SAFA -->
  <g class="district-node" transform="translate(370, 245)">
    <circle cx="0" cy="0" r="4.5" fill="#ffffff" stroke="#192023" stroke-width="1.8" filter="url(#sub-pin-shadow)" />
    <circle cx="0" cy="0" r="2" fill="#c51210" />
    <text x="12" y="2" class="district-label">Jumeirah</text>
    <text x="12" y="12" class="district-sublabel">Al Safa &amp; Canal</text>
  </g>

  <!-- 4. ARABIAN RANCHES & MOTOR CITY -->
  <g class="district-node" transform="translate(380, 430)">
    <circle cx="0" cy="0" r="4.5" fill="#ffffff" stroke="#192023" stroke-width="1.8" filter="url(#sub-pin-shadow)" />
    <circle cx="0" cy="0" r="2" fill="#c51210" />
    <text x="12" y="2" class="district-label">Arabian Ranches</text>
    <text x="12" y="12" class="district-sublabel">Motor City &amp; Hills</text>
  </g>

  <!-- 5. DUBAI HILLS ESTATE -->
  <g class="district-node" transform="translate(420, 340)">
    <circle cx="0" cy="0" r="4.5" fill="#ffffff" stroke="#192023" stroke-width="1.8" filter="url(#sub-pin-shadow)" />
    <circle cx="0" cy="0" r="2" fill="#c51210" />
    <text x="12" y="2" class="district-label">Dubai Hills</text>
    <text x="12" y="12" class="district-sublabel">Golf Estates</text>
  </g>

  <!-- 6. BUSINESS BAY & DIFC -->
  <g class="district-node" transform="translate(460, 235)">
    <circle cx="0" cy="0" r="4.5" fill="#ffffff" stroke="#192023" stroke-width="1.8" filter="url(#sub-pin-shadow)" />
    <circle cx="0" cy="0" r="2" fill="#c51210" />
    <text x="-12" y="16" class="district-label" text-anchor="end">Business Bay</text>
  </g>

  <!-- 7. DEIRA & OLD DUBAI -->
  <g class="district-node" transform="translate(635, 120)">
    <circle cx="0" cy="0" r="4.5" fill="#ffffff" stroke="#192023" stroke-width="1.8" filter="url(#sub-pin-shadow)" />
    <circle cx="0" cy="0" r="2" fill="#c51210" />
    <text x="12" y="2" class="district-label">Deira &amp; Creek</text>
    <text x="12" y="12" class="district-sublabel">Commercial Hub</text>
  </g>

  <!-- 8. MIRDIF & SILICON OASIS -->
  <g class="district-node" transform="translate(680, 230)">
    <circle cx="0" cy="0" r="4.5" fill="#ffffff" stroke="#192023" stroke-width="1.8" filter="url(#sub-pin-shadow)" />
    <circle cx="0" cy="0" r="2" fill="#c51210" />
    <text x="12" y="2" class="district-label">Mirdif</text>
    <text x="12" y="12" class="district-sublabel">Silicon Oasis</text>
  </g>

  <!-- ================= CENTRAL DISPATCH HERO HUB (DOWNTOWN DUBAI / BURJ KHALIFA) ================= -->
  <g id="central-dispatch-hub" transform="translate(495, 205)">
    <!-- Concentric Animated Pulse Waves -->
    <circle cx="0" cy="0" r="16" fill="url(#hub-radar-grad)" />
    <circle cx="0" cy="0" r="14" class="hub-pulse" stroke="#c51210" fill="none" />
    <circle cx="0" cy="0" r="14" class="hub-pulse-d2" stroke="#ff5a52" fill="none" />

    <!-- Anchor Ground Shadow -->
    <ellipse cx="0" cy="14" rx="10" ry="3.5" fill="rgba(197, 18, 16, 0.35)" />

    <!-- Hero Location Pin Shape (ApexFix Crimson Master Pin) -->
    <path d="M 0 14 C -5 6 -14 -4 -14 -16 C -14 -24.8 -7.7 -32 0 -32 C 7.7 -32 14 -24.8 14 -16 C 14 -4 5 6 0 14 Z" 
          fill="#c51210" stroke="#ffffff" stroke-width="2.2" filter="url(#hub-pin-glow)" />
    <!-- Live Green Pulse Indicator Inside Pin -->
    <circle cx="0" cy="-16" r="4.5" fill="#ffffff" />
    <circle cx="0" cy="-16" r="3" fill="#10b981" />

    <!-- Elevated Floating Hub Dispatch Callout Card -->
    <g transform="translate(0, -42)">
      <!-- Card Pill Background -->
      <rect x="-82" y="-18" width="164" height="28" rx="14" 
            fill="#192023" stroke="rgba(255, 255, 255, 0.28)" stroke-width="1.2"
            filter="url(#sub-pin-shadow)" />
      <!-- Pointer Triangle -->
      <path d="M -5 10 L 0 15 L 5 10 Z" fill="#192023" />
      
      <!-- Live Pulse Green Dot -->
      <circle cx="-65" cy="-4" r="3.8" fill="#10b981" />
      
      <!-- Text: Dubai Central Dispatch -->
      <text x="-54" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5px" font-weight="800" fill="#ffffff" letter-spacing="-0.01em">
        Dubai Central Dispatch
      </text>
    </g>
  </g>

  <!-- Live Dispatch Metrics Watermark Badge (Bottom Right) -->
  <g transform="translate(680, 480)" opacity="0.95">
    <rect x="0" y="0" width="195" height="58" rx="14" 
          fill="rgba(255, 255, 255, 0.92)" stroke="rgba(227, 231, 233, 0.95)" stroke-width="1.2" 
          filter="url(#sub-pin-shadow)" />
    <circle cx="24" cy="22" r="4.5" fill="#10b981" />
    <circle cx="24" cy="22" r="8" stroke="#10b981" stroke-width="1" opacity="0.5" fill="none" />
    <text x="38" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11px" font-weight="800" fill="#192023">14+ Mobile Vans Active</text>
    <text x="38" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5px" font-weight="600" fill="#64748b">Doorstep Arrival: &lt; 30 Mins</text>
  </g>
</svg>
